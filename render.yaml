# Blueprint da API do Mesa Clara na Render.
# SPEC: SPEC/2026-11-24-publicacao-da-api-na-render.md
# Cria um PostgreSQL free e um web service Docker com a API NestJS.
databases:
  - name: mesa-clara-db
    databaseName: restaurante
    user: restaurante
    plan: free
    region: oregon

services:
  - type: web
    name: mesa-clara-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # O start (migrações, seed idempotente e servidor) vem do CMD do
    # Dockerfile (apps/api/docker-entrypoint.sh). Não usar dockerCommand
    # inline: a Render não o executa via shell e a string com && vira um
    # único comando (exit 127).
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mesa-clara-db
          property: connectionString
      # Origem única liberada no CORS: a publicação de produção da Vercel.
      - key: WEB_ORIGIN
        value: https://dsai-ap2-sigrestaurant.vercel.app
      - key: NODE_ENV
        value: production
