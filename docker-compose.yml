services:
  # Stack completa da AP2: banco, API e frontend.
  # O frontend usa a API quando NEXT_PUBLIC_API_URL está definida no build;
  # sem ela, o app funciona no modo local (localStorage), como na Vercel.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurante
      POSTGRES_PASSWORD: restaurante_local
      POSTGRES_DB: restaurante
    ports:
      - "${DB_PORT:-55433}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurante"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restaurante:restaurante_local@db:5432/restaurante?schema=public
      PORT: "4000"
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-4000}:4000"
    command: >
      sh -c "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
             npm --workspace apps/api run prisma:seed &&
             node apps/api/dist/main.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  dados-postgres:
